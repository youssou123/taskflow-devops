name: CI/CD TaskFlow

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
    

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          pip install -r app/requirements.txt
          PYTHONPATH=app pytest app/test_main.py

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }} ./app

      - name: Scan image with Trivy (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}

      - name: Update Kubernetes manifest (GitOps)
        run: |
          sed -i "s|image: .*taskflow-api:.*|image: ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}|g" k8s/base/api-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(gitops): deploy image ${{ github.sha }}" || exit 0
          git push